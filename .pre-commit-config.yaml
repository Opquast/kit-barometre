# Garde-fous du dépôt, gérés par le framework pre-commit (https://pre-commit.com).
# Installation, une fois après un clone :
#   pre-commit install --install-hooks -t pre-commit -t commit-msg -t pre-push
# Lancer tout à la main : pre-commit run --all-files (avant commit)
#                         pre-commit run --all-files --hook-stage pre-push (avant push)
# La quality analysis BMAD n'est pas ici : elle se lance à la main.

default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
exclude: ^rapports/

repos:
  # --- Avant chaque commit : fichiers, syntaxe, gros fichiers ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  # --- Python : lint ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--config, kit-barometre-sites/code/pyproject.toml]

  # --- Secrets ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # --- Sécurité du code Python (avant push) ---
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        stages: [pre-push]
        args: [-c, .bandit.yaml, -q]
        additional_dependencies: ["bandit[yaml]"]
        exclude: (^|/)tests/

  - repo: local
    hooks:
      # --- Message de commit : Conventional Commits en anglais ---
      - id: conventional-commit-en
        name: message de commit (Conventional Commits, anglais)
        entry: .githooks/commit-msg
        language: script
        stages: [commit-msg]

      # --- JavaScript : syntaxe et lint ---
      - id: node-check
        name: syntaxe JavaScript (node --check)
        entry: outils/verifications/node_check.sh
        language: script
        files: \.(m?js)$
      - id: eslint
        name: ESLint
        entry: eslint --config kit-barometre-sites/code/eslint.config.mjs --max-warnings=0
        language: node
        additional_dependencies: [eslint@10.15.0]
        files: ^kit-barometre-sites/code/.*\.(m?js)$

      # --- Skills : frontmatter et fichiers cités ---
      - id: structure-skill
        name: structure des skills (frontmatter, fichiers cités)
        entry: python3 outils/verifications/structure_skill.py
        language: python
        additional_dependencies: [pyyaml==6.0.3]
        files: (^|/)\.claude/skills/
        stages: [pre-commit, pre-push]

      # --- Données personnelles dans les exemples ---
      - id: donnees-personnelles
        name: données personnelles (CSV, Excel)
        entry: python3 outils/verifications/donnees_personnelles.py
        language: python
        additional_dependencies: [openpyxl==3.1.5]
        files: \.(csv|tsv|xlsx|xlsm)$

      # --- Partage : chemins personnels, URL d'Artifact ---
      - id: partage
        name: partage (chemins absolus, URL d'Artifact)
        entry: python3 outils/verifications/partage.py
        language: python
        types: [text]
        exclude: (^rapports/|^\.pre-commit-config\.yaml$|^outils/verifications/partage\.py$|(^|/)tests/)

      # --- Tests Python, couverture exigée à 100 % (avant push) ---
      - id: tests-couverture
        name: tests Python (couverture 100 %)
        entry: outils/verifications/tests_couverture.sh
        language: python
        additional_dependencies: [pytest==9.0.3, pytest-cov==7.1.0, openpyxl==3.1.5, pyyaml==6.0.3]
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # --- Dépendances Node (avant push) ---
      - id: npm-audit
        name: npm audit (dépendances du kit)
        entry: npm audit --prefix kit-barometre-sites/code --audit-level=high --omit=dev
        language: system
        pass_filenames: false
        files: ^kit-barometre-sites/code/package(-lock)?\.json$
        stages: [pre-push]
