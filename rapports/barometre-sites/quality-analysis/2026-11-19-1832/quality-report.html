": "« Lire le journal » sans le cibler", "file": "SKILL.md", "line": 61, "detail": "Le journal concatène la sortie de plus de 20 scripts sur 47 écrans.", "source": "execution-efficiency"}, {"title": "Lecture du journal de nuit par le LLM", "file": "SKILL.md", "line": 61, "detail": "2 000 à 10 000 jetons selon la taille, à chaque passage.", "source": "script-opportunities"}, {"title": "Une nuit perdue pour un seul site", "file": "scripts/barometre.py", "line": 0, "detail": "Sans --continuer, un échec arrête tout ; le matin, des sites ne sont pas mesurés.", "source": "enhancement-opportunities"}, {"title": "Pas de tableau de bord d'état du passage", "file": "SKILL.md", "line": 76, "detail": "L'ordre du matin n'est consigné nulle part.", "source": "enhancement-opportunities"}, {"title": "Écarts sans décision : une ligne Python fragile", "file": "SKILL.md", "line": 99, "detail": "Commande de 300 caractères à recopier, pas de dossier compact par écart.", "source": "script-opportunities"}, {"title": "Contrôle final par un one-liner illisible", "file": "SKILL.md", "line": 99, "detail": "Fragile à recopier et à porter vers un autre assistant.", "source": "structure"}, {"title": "Contrôle déterministe en ligne de commande dans le prompt", "file": "SKILL.md", "line": 99, "detail": "Le prompt ne devrait garder que « doit sortir à 0 ».", "source": "prompt-craft"}, {"title": "Compte rendu final assemblé à la main", "file": "SKILL.md", "line": 111, "detail": "Chiffres éparpillés entre scores.csv, lecture.json, tests.csv et le journal.", "source": "script-opportunities"}, {"title": "Compte rendu qui reste dans la conversation", "file": "SKILL.md", "line": 111, "detail": "À écrire aussi dans resultats/barometre-<date>/compte-rendu.md.", "source": "enhancement-opportunities"}, {"title": "Liste « à arbitrer » non actionnable", "file": "SKILL.md", "line": 94, "detail": "Présenter les écarts un par un avec un choix rapide, puis écrire la décision dans ANALYSE_SOURCES.", "source": "enhancement-opportunities"}]}, {"name": "Sources et étapes citées sans mode d'emploi", "description": "Plusieurs éléments consommés par la synthèse ou demandés par la publication n'ont aucune étape documentée pour être produits : le contre-examen dans le navigateur, l'export ESM basics, le report dans ESM (alors que import_esm.py existe), la note de cadrage absente du kit, et des scripts hors pipeline. Sur un kit neuf, une source disparaît ou une étape échoue sans qu'on le sache.", "severity": "medium", "impact": "Une skill dont chaque source et chaque livrable est rejouable, et un kit neuf qui ne trébuche pas à l'étape 5 de la publication.", "action": "Ajouter un court paragraphe par source réutilisée (contre-examen, ESM basics, report ESM via import_esm.py) disant quand la refaire et comment, rendre l'étape note de cadrage conditionnelle (ou livrer un modèle), documenter --forcer et --hors pour --installer, et décrire en une ligne chaque script hors pipeline dans « Fichiers utiles ».", "finding_count": 9, "findings": [{"title": "Source « contre-examen » orpheline", "file": "scripts/contre_examen.mjs", "line": 0, "detail": "Consommée par lecture_critique.py et generer_suivi.py, jamais relancée : l'ancienne fiche est réutilisée silencieusement.", "source": "agent-cohesion"}, {"title": "ESM présent en entrée et en sortie, sans mode d'emploi", "file": "SKILL.md", "line": 83, "detail": "agregat.json et synthese_esm_basics.py hors texte ; import_esm.py non cité.", "source": "agent-cohesion"}, {"title": "Report des changements dans eServices Manager à la main", "file": "SKILL.md", "line": 109, "detail": "Comparer deux passages et trouver l'audit cible : à scripter (changements_passage.py).", "source": "script-opportunities"}, {"title": "note_cadrage.md absent du kit", "file": "SKILL.md", "line": 110, "detail": "verifier_page_a4.py le prend par défaut et échouera sur un kit neuf.", "source": "structure"}, {"title": "Étape de publication qui renvoie à un fichier absent", "file": "SKILL.md", "line": 110, "detail": "Écrire « si note_cadrage.md existe », sur le modèle d'ESM et de liens-locaux.json.", "source": "prompt-craft"}, {"title": "Chiffres de la note de cadrage recopiés", "file": "SKILL.md", "line": 110, "detail": "verifier_page_a4.py ne contrôle que la longueur.", "source": "script-opportunities"}, {"title": "Outils hors pipeline non répertoriés", "file": "scripts/", "line": 0, "detail": "nu_local.mjs, outils_en_ligne.py, generer_schema.py, axe_navigateur.js, controles_page.js : rôle inconnu ; vnu non vérifié.", "source": "agent-cohesion"}, {"title": "Option --forcer non documentée", "file": "SKILL.md", "line": 65, "detail": "barometre.py:138 permet la nuit sur batterie.", "source": "structure"}, {"title": "Options incomplètes", "file": "SKILL.md", "line": 34, "detail": "--installer montré sans --hors.", "source": "prompt-craft"}]}, {"name": "Un baromètre sans évolution ni mode consultation", "description": "Un baromètre se lit dans le temps, mais ni la synthèse ni le compte rendu ne comparent au passage précédent. Et la skill démarre toujours sur « lancer la mesure » : une simple question sur un score peut déclencher une proposition de passage de plusieurs heures.", "severity": "high", "impact": "Répond à la première question de la commanditaire (« ça va mieux ? ») avec des données déjà présentes dans resultats/, et évite les déclenchements inutiles.", "action": "Ouvrir la skill par une question d'intention (consulter le dernier passage, rejouer la synthèse, ou lancer un nouveau passage) et ajouter une colonne « passage précédent » et « écart » à scores.csv, avec la liste des règles passées de C à NC et inversement dans le compte rendu.", "finding_count": 3, "findings": [{"title": "Pas de mode consultation", "file": "SKILL.md", "line": 3, "detail": "Les questions « quel est le score de Boutique B ? » n'ont pas de chemin distinct.", "source": "enhancement-opportunities"}, {"title": "Un baromètre sans évolution", "file": "scripts/exp ans eServices Manager, premier passage sur un compte (liens-locaux.json), anti-robot ou 429 noté NT avec la raison, batterie (code 4)."}, {"title": "Portabilité multi-assistants pensée", "detail": "INSTALLER-AVEC-UN-ASSISTANT-IA.md donne de vraies équivalences outil par outil (sous-agent isolé, page publique de règle, envoi des CSV)."}, {"title": "Prompt dense et sans remplissage", "detail": "118 lignes, environ 3 300 jetons, divulgation progressive, aucun motif de remplissage ni mur de texte ; toutes les références de fichiers résolues sauf note_cadrage.md."}], "detailed_analysis": {"structure": {"assessment": "La structure tient : toutes les références de fichiers résolues sauf note_cadrage.md, enchaînement ordonné de l'installation à la publication, garde-fous en tête. Les constats élevés de la pré-passe (sections Identity, Communication Style, Principles, On Activation, mots de progression) mesurent une skill de workflow contre le gabarit d'un agent à persona et ne sont pas des pannes ; les deux constats élevés du lint de chemins visent un emplacement voulu et un faux positif.", "findings": [{"title": "Sections d'agent BMAD absentes (Overview, Identity, Communication Style, Principles, On Activation)", "file": "SKILL.md", "line": 1, "detail": "Choix cohérent pour une skill de procédure sans persona ; « Règles à ne jamais enfreindre » et « Trancher les écarts » jouent le rôle de principes.", "severity": "low", "source": "structure"}, {"title": "Fichier de prompt à la racine de la skill", "file": "INSTALLER-AVEC-UN-ASSISTANT-IA.md", "line": 0, "detail": "Signalé élevé par le lint ; le guide vise les humains et les autres assistants et est cité « dans ce dossier » par SKILL.md. Le déplacer dans references/ est possible à condition de mettre à jour ce renvoi et la copie à la racine du kit.", "severity": "low", "source": "path-standards"}, {"title": "Référence ../ en ligne 51", "file": "INSTALLER-AVEC-UN-ASSISTANT-IA.md", "line": 51, "detail": "Signalé élevé par le lint ; il s'agit de l'argument --hors ../hors d'une commande d'exemple, pas d'un renvoi de fichier. Faux positif, ou remplacer par un chemin absolu d'exemple.", "severity": "low", "source": "path-standards"}, {"title": "Nom sans « agent » et déclenchement en français", "file": "SKILL.md", "line": 1, "detail": "« Utiliser dès qu'on parle de… » est l'équivalent du « Use when » ; le nom est cohérent hors module BMAD.", "severity": "low", "source": "structure"}, {"title": "Description longue et déclenchement large", "file": "SKILL.md", "line": 3, "detail": "Environ 800 caractères, liste d'outils peu utile au déclenchement ; un résumé court suivi de phrases de déclenchement serait plus net.", "severity": "low", "source": "structure"}, {"title": "Tension légère sur les commits", "file": "SKILL.md", "line": 20, "detail": "« Commit et push après chaque étape » gagnerait à rappeler verifier_publication.py.", "severity": "low", "source": "structure"}]}, "persona": {"assessment": "Pas de persona par conception : c'est un orchestrateur de workflow et la grille « voix » ne s'applique pas. Le paragraphe d'ouverture joue bien le rôle de vue d'ensemble (objectif, principe des deux sources, périmètre) ; seul un titre manque. L'écriture est impérative, justifiée là où la contrainte n'est pas évidente, et sans remplissage.", "overview_quality": "appropriate", "findings": [{"title": "Vue d'ensemble sans titre", "file": "SKILL.md", "line": 8, "detail": "Un titre « Vue d'ensemble » et une ligne « En bref : prérequis, passage de nuit, lectures IA, synthèse, arbitrage, publication » aideraient le repérage.", "severity": "low", "source": "prompt-craft"}, {"title": "Doublons SKILL.md / INSTALLER qui divergent", "file": "INSTALLER-AVEC-UN-ASSISTANT-IA.md", "line": 80, "detail": "Liste du mode nuit (VPN, PowerToys Awake d'un seul côté) et cas Windows différents : décider lequel fait foi.", "severity": "low", "source": "prompt-craft"}, {"title": "Dépôt personnel à préciser pour un élève", "file" u", "file": "SKILL.md", "line": 107, "detail": "Écrire « à la racine du code, ignoré par Git » pour éviter qu'une IA le cherche dans --hors.", "severity": "low", "source": "agent-cohesion"}]}, "efficiency": {"assessment": "L'exécution est bien pensée : mesure scriptée hors contexte, sous-agents en arrière-plan qui écrivent dans des fichiers, ressources chargées à la demande, aucune chaîne de sous-agents ni cycle. Les points faibles (ordonnancement autour de la lecture 3, get_rule répétés, lots trop lourds, journal lu en entier) sont repris dans les thèmes.", "findings": [{"title": "Vérification d'installation lancée deux fois", "file": "SKILL.md", "line": 24, "detail": "barometre.py relance déjà verifier_installation.py ; réserver l'appel manuel à l'installation et au code 3.", "severity": "low", "source": "execution-efficiency"}, {"title": "Entrelacer les sites dans les scripts de mesure", "file": "scripts/controles_reseau.py", "line": 19, "detail": "Un tourniquet par site garderait le rythme par boutique et diviserait l'attente par 4 à 6, mais toutes les boutiques sont chez Shopify : option limitée (2 ou 3 sites) à décider avec la commanditaire, pas un défaut.", "severity": "low", "source": "execution-efficiency"}]}, "experience": {"assessment": "L'accord avant action est exemplaire et les relectures indépendantes sont une vraie force. Les frictions se concentrent sur l'adaptation du kit par un élève, la reprise du matin sans état écrit et l'absence de chemin « consultation ». Le mode sans interaction est partiellement possible : toute la chaîne jusqu'à la synthèse finale peut tourner seule, la publication et les arbitrages restent humains.", "journeys": [{"archetype": "first-timer", "summary": "Une élève de la formation installe le kit avec son assistant : la vérification d'installation la rassure, puis l'étape « adapter aux sites » l'oblige à modifier six fichiers Python, un JSON et des décisions nommées.", "friction_points": ["Mur d'hypothèses au moment de configurer le parc", "CSV livré (« Ma boutique ») incompatible avec les tables des scripts", "Aucune validation de cohérence parc / écrans"], "bright_spots": ["Rien ne s'installe sans accord", "--essai pour voir les commandes", "Règles absolues claires et répétées"]}, {"archetype": "expert", "summary": "La commanditaire relance le baromètre : nuit ou maintenant, reprise --depuis simple, mais le déroulé du matin en quatre temps doit être retenu de tête.", "friction_points": ["Pas de commande « où en suis-je »", "Ligne Python illisible pour les écarts sans décision"], "bright_spots": ["--etapes synthese en quelques secondes pour itérer sur l'arbitrage"]}, {"archetype": "confused", "summary": "Quelqu'un demande juste le score d'une boutique : la description large risque de déclencher une proposition de passage de plusieurs heures.", "friction_points": ["Pas de chemin consultation distinct du chemin mesure"], "bright_spots": ["Les CSV et la page existent déjà et répondraient à la question"]}, {"archetype": "edge-case", "summary": "Site non Shopify, multilingue ou produit retiré du catalogue : les sources Shopify tournent sans condition et un écran en 404 fait basculer des règles sans explication.", "friction_points": ["Sources Shopify non désactivables", "Écrans obsolètes non détectés avant les heures de mesure"], "bright_spots": ["Le kit dit honnêtement que certaines sources n'existent pas hors Shopify"]}, {"archetype": "hostile-environment", "summary": "Batterie et Windows bien gérés ; en revanche un échec de script arrête toute la nuit, le MCP Opquast absent n'a pas de repli dans la skill, et l'état des lectures n'est écrit nulle part en cas de compactage.", "friction_points": ["Nuit perdue pour un seul site sans --continuer", "Pas de repli documenté sans get_rule dans SKILL.md", "État des lectures perdu au compactage"], "bright_spots": ["Code 4 sur batterie", "429 et anti-robot notés NT avec la raison"]}, {"archetype": "automator", "summary": "barometre.py est non inter dings": [{"title": "Tiret long contrôlé sur deux livrables seulement", "file": "scripts/verifier_publication.py", "line": 0, "detail": "Ajouter un avertissement pour tout « — » dans les livrables du dernier passage et la note de cadrage.", "severity": "low", "source": "script-opportunities"}, {"title": "Adresse de publication et âge de l'export ESM", "file": "SKILL.md", "line": 107, "detail": "Faire imprimer par la synthèse l'adresse Artifact à réutiliser et l'âge de l'export basics ; option --noter-lien.", "severity": "low", "source": "script-opportunities"}]}}, "recommendations": [{"rank": 1, "action": "Outiller les lectures indépendantes : listes de règles dans referentiel/lectures.json, briefs générés par preparer_lectures.py, sorties validées par valider_lectures.py (lecture 2 comprise), ordre écrit (attendre les lectures 1 et 2, synthèse, règles à une source, lecture 3 par site).", "resolves": 12, "effort": "medium"}, {"rank": 2, "action": "Créer un fichier de parc unique et neutre lu par tous les scripts et la skill, avec un script de configuration ; neutraliser la description, le commanditaire et les chiffres datés de SKILL.md.", "resolves": 10, "effort": "high"}, {"rank": 3, "action": "Outiller le matin : bilan_journal.py, ecarts_a_trancher.py à code de sortie (remplace le one-liner), état du passage et compte rendu chiffré écrit dans resultats/ ; --continuer par défaut en mode --nuit.", "resolves": 10, "effort": "medium"}, {"rank": 4, "action": "Documenter les sources réutilisées et les étapes orphelines : contre-examen, ESM basics, report ESM via import_esm.py, note de cadrage conditionnelle, --forcer, --hors pour --installer, scripts hors pipeline.", "resolves": 9, "effort": "low"}, {"rank": 5, "action": "Ouvrir la skill par une question d'intention (consulter, rejouer la synthèse, nouveau passage) et ajouter l'évolution par rapport au passage précédent dans scores.csv et le compte rendu.", "resolves": 3, "effort": "medium"}, {"rank": 6, "action": "Aligner SKILL.md et INSTALLER (une seule source de vérité pour le mode nuit et Windows) et décider de l'emplacement d'INSTALLER signalé par le lint.", "resolves": 4, "effort": "low"}]}</script>
<script>
const RAW = JSON.parse(document.getElementById('report-data').textContent);
const DATA = normalize(RAW);

function normalize(d) {
  if (d.meta) {
    d.meta.skill_name = d.meta.skill_name || d.meta.skill || d.meta.name || 'Unknown';
    d.meta.scanner_count = typeof d.meta.scanner_count === 'number' ? d.meta.scanner_count
      : Array.isArray(d.meta.scanners_run) ? d.meta.scanners_run.length
      : d.meta.scanner_count || 0;
  }
  d.strengths = (d.strengths || []).map(s =>
    typeof s === 'string' ? { title: s, detail: '' } : { title: s.title || '', detail: s.detail || '' }
  );
  (d.opportunities || []).forEach(o => {
    o.name = o.name || o.title || '';
    o.finding_count = o.finding_count || (o.findings || o.findings_resolved || []).length;
    if (!o.findings && o.findings_resolved) o.findings = [];
    o.action = o.action || o.fix || '';
  });
  (d.broken || []).forEach(b => {
    b.detail = b.detail || b.description || '';
    b.action = b.action || b.fix || '';
  });
  (d.recommendations || []).forEach((r, i) => {
    r.action = r.action || r.description || '';
    r.rank = r.rank || i + 1;
  });
  // Fix journeys
  if (d.detailed_analysis && d.detailed_analysis.experience) {
    d.detailed_analysis.experience.journeys = (d.detailed_analysis.experience.journeys || []).map(j => ({
      archetype: j.archetype || j.persona || j.name || 'Unknown',
      summary: j.summary || j.journey_summary || j.description || j.friction || '',
      friction_points: j.friction_points || (j.friction ? [j.friction] : []),
      bright_spots: j.bright_spots || (j.bright ? [j.bright] : [])
    }));
  }
  // Fix capabilities
  (d.capabilities || []).forEach(c => {
    c.finding_count = c.finding_count || (c.findings || []).length;
    c.status = c.status || (c.finding_count > 0 ? 'needs-attention' : 'good');
  });
  return d;
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function init() {
  const m = DATA.meta;
  document.getElementById('skill-name').textContent = m.skill_name;
  document.getElementById('subtitle').innerHTML =
    `${esc(m.skill_path)} &bull; ${m.timestamp ? m.timestamp.split('T')[0] : ''} &bull; ${m.scanner_count || 0} scanners &bull; <a href="quality-report.md">Full Report &nearr;</a>`;

  renderPortrait();
  document.getElementById('grade-area').innerHTML = `<div class="grade grade-${DATA.grade}">${esc(DATA.grade)}</div>`;
  document.getElementById('narrative').textContent = DATA.narrative || '';

  renderCapabilities();
  renderBroken();
  renderOpportunities();
  renderStrengths();
  renderRecommendations();
  renderDetailed();
}

function renderPortrait() {
  const p = DATA.agent_profile;
  if (!p) return;
  let html = `<div class="portrait"><div class="portrait-header">`;
  if (p.icon) html += `<span class="portrait-icon">${esc(p.icon)}</span>`;
  html += `<div><div class="portrait-name">${esc(p.display_name)}</div>`;
  if (p.title) html += `<div class="portrait-title">${esc(p.title)}</div>`;
  html += `</div></div>`;
  if (p.portrait) html += `<div class="portrait-desc">${esc(p.portrait)}</div>`;
  html += `</div>`;
  document.getElementById('portrait').innerHTML = html;
}

function renderCapabilities() {
  const caps = DATA.capabilities || [];
  if (!caps.length) return;
  const good = caps.filter(c => c.status === 'good').length;
  const attn = caps.length - good;
  let summary = `${caps.length} capabilities`;
  if (attn > 0) summary += ` \u00b7 ${attn} need attention`;

  let html = `<div class="section"><div class="section-header open" onclick="toggleSection(this)">`;
  html += `<span class="arrow">&#9654;</span><span class="label">Capabilities (${summary})</span>`;
  html += `</div><div class="section-body open">`;
  caps.forEach((cap, idx) => {
    const statusBadge = cap.status === 'good'
      ? `<span class="badge badge-good">Good</span>`
      : `<span class="badge badge-attention">${cap.finding_count} observation${cap.finding_count !== 1 ? 's' : ''}</span>`;
    const hasFindings = cap.findings && cap.findings.length > 0;
    html += `<div class="cap-row" ${hasFindings ? `onclick="toggleCapFindings(${idx})" style="cursor:pointer"` : ''}>`;
    html += `${statusBadge} <span class="cap-name">${esc(cap.name)}</span>`;
    if (cap.file) html += `<span class="cap-file">${esc(cap.file)}</span>`;
    html += `</div>`;
    if (hasFindings) {
      html += `<div class="cap-findings" id="cap-findings-${idx}">`;
      cap.findings.forEach(f => {
        html += `<div class="cap-finding">`;
        if (f.severity) html += `<span class="badge badge-${f.severity}">${esc(f.severity)}</span> `;
        html += `${esc(f.title)}`;
        if (f.source) html += ` <span class="source" style="font-size:0.75rem;color:var(--text-dim)">[${esc(f.source)}]</span>`;
        html += `</div>`;
      });
      html += `</div>`;
    }
  });
  html += `</div></div>`;
  document.getElementById('capabilities-section').innerHTML = html;
}

function renderBroken() {
  const items = DATA.broken || [];
  if (!items.length) return;
  let html = `<div class="section"><div class="section-header open" onclick="toggleSection(this)">`;
  html += `<span class="arrow">&#9654;</span><span class="label">Broken / Critical (${items.length})</span>`;
  html += `<div class="actions"><button class="btn btn-primary" onclick="event.stopPropagation();showBrokenPrompt()">Fix These</button></div>`;
  html += `</div><div class="section-body open">`;
  items.forEach(item => {
    const loc = item.file ? `${item.file}${item.line ? ':'+item.line : ''}` : '';
    html += `<div class="item"><span class="badge badge-${item.severity || 'high'}">${esc(item.severity || 'high')}</span> `;
    if (loc) html += `<span class="item-file">${esc(loc)}</span>`;
    html += `<div class="item-title">${esc(item.title)}</div>`;
    if (item.detail) html += `<div class="item-desc">${esc(item.detail)}</div>`;
    if (item.action) html += `<div class="item-action"><strong>Fix:</strong> ${esc(item.action)}</div>`;
    html += `</div>`;
  });
  html += `</div></div>`;
  document.getElementById('broken-section').innerHTML = html;
}

function renderOpportunities() {
  const opps = DATA.opportunities || [];
  if (!opps.length) return;
  let html = `<div class="section"><div class="section-header open" onclick="toggleSection(this)">`;
  html += `<span class="arrow">&#9654;</span><span class="label">Opportunities (${opps.length})</span>`;
  html += `</div><div class="section-body open">`;
  opps.forEach((opp, idx) => {
    html += `<div class="opp"><div class="opp-header">`;
    html += `<span class="badge badge-${opp.severity || 'medium'}">${esc(opp.severity || 'medium')}</span>`;
    html += `<span class="opp-name">${idx+1}. ${esc(opp.name)}</span>`;
    html += `<span class="opp-count">${opp.finding_count || (opp.findings||[]).length} observations</span>`;
    html += `<button class="btn" onclick="toggleFindings(${idx})">Details</button>`;
    html += `<button class="btn btn-primary" onclick="showThemePrompt(${idx})">Fix This</button>`;
    html += `</div>`;
    html += `<div class="opp-desc">${esc(opp.description)}</div>`;
    if (opp.impact) html += `<div class="opp-impact">Impact: ${esc(opp.impact)}</div>`;
    html += `<div class="opp-findings" id="findings-${idx}">`;
    (opp.findings || []).forEach(f => {
      const loc = f.file ? `${f.file}${f.line ? ':'+f.line : ''}` : '';
      html += `<div class="opp-finding"><strong>${esc(f.title)}</strong>`;
      if (loc) html += ` <span class="item-file">${esc(loc)}</span>`;
      if (f.source) html += ` <span class="source">[${esc(f.source)}]</span>`;
      if (f.detail) html += `<br>${esc(f.detail)}`;
      html += `</div>`;
    });
    html += `</div></div>`;
  });
  html += `</div></div>`;
  document.getElementById('opportunities-section').innerHTML = html;
}

function renderStrengths() {
  const items = DATA.strengths || [];
  if (!items.length) return;
  let html = `<div class="section"><div class="section-header" onclick="toggleSection(this)">`;
  html += `<span class="arrow">&#9654;</span><span class="label">Strengths (${items.length})</span>`;
  html += `</div><div class="section-body">`;
  items.forEach(s => {
    html += `<div class="strength-item"><div class="title">${esc(s.title)}</div>`;
    if (s.detail) html += `<div class="detail">${esc(s.detail)}</div>`;
    html += `</div>`;
  });
  html += `</div></div>`;
  document.getElementById('strengths-section').innerHTML = html;
}

function renderRecommendations() {
  const recs = DATA.recommendations || [];
  if (!recs.length) return;
  let html = `<div class="section"><div class="section-header open" onclick="toggleSection(this)">`;
  html += `<span class="arrow">&#9654;</span><span class="label">Recommendations</span>`;
  html += `</div><div class="section-body open"><div class="recs">`;
  recs.forEach(r => {
    html += `<div class="rec"><span class="rec-rank">#${r.rank}</span>${esc(r.action)}`;
    if (r.resolves) html += ` <span class="rec-resolves">(resolves ${r.resolves} observations)</span>`;
    html += `</div>`;
  });
  html += `</div></div></div>`;
  document.getElementById('recommendations-section').innerHTML = html;
}

function renderDetailed() {
  const da = DATA.detailed_analysis;
  if (!da) return;
  const dims = [
    ['structure', 'Structure & Capabilities'],
    ['persona', 'Persona & Voice'],
    ['cohesion', 'Identity Cohesion'],
    ['efficiency', 'Execution Efficiency'],
    ['experience', 'Conversation Experience'],
    ['scripts', 'Script Opportunities']
  ];
  let html = `<div class="section"><div class="section-header" onclick="toggleSection(this)">`;
  html += `<span class="arrow">&#9654;</span><span class="label">Detailed Analysis</span>`;
  html += `</div><div class="section-body">`;
  dims.forEach(([key, label]) => {
    const dim = da[key];
    if (!dim) return;
    html += `<div class="analysis-section"><h4>${label}</h4>`;
    if (dim.assessment) html += `<p>${esc(dim.assessment)}</p>`;
    if (dim.dimensions) {
      html += `<table style="width:100%;font-size:0.85rem;margin:0.5rem 0;border-collapse:collapse;">`;
      html += `<tr><th style="text-align:left;padding:0.3rem;border-bottom:1px solid var(--border)">Dimension</th><th style="text-align:left;padding:0.3rem;border-bottom:1px solid var(--border)">Score</th><th style="text-align:left;padding:0.3rem;border-bottom:1px solid var(--border)">Notes</th></tr>`;
      Object.entries(dim.dimensions).forEach(([d, v]) => {
        if (v && typeof v === 'object') {
          html += `<tr><td style="padding:0.3rem;border-bottom:1px solid var(--border)">${esc(d.replace(/_/g,' '))}</td><td style="padding:0.3rem;border-bottom:1px solid var(--border)">${esc(v.score||'')}</td><td style="padding:0.3rem;border-bottom:1px solid var(--border)">${esc(v.notes||'')}</td></tr>`;
        }
      });
      html += `</table>`;
    }
    if (dim.journeys && dim.journeys.length) {
      dim.journeys.forEach(j => {
        html += `<div style="margin:0.5rem 0"><strong>${esc(j.archetype)}</strong>: ${esc(j.summary || j.journey_summary || '')}`;
        if (j.friction_points && j.friction_points.length) {
          html += `<ul style="color:var(--high);font-size:0.85rem;padding-left:1.25rem">`;
          j.friction_points.forEach(fp => { html += `<li>${esc(fp)}</li>`; });
          html += `</ul>`;
        }
        html += `</div>`;
      });
    }
    if (dim.autonomous) {
      const a = dim.autonomous;
      html += `<p><strong>Headless Potential:</strong> ${esc(a.potential||'')}`;
      if (a.notes) html += ` \u2014 ${esc(a.notes)}`;
      html += `</p>`;
    }
    (dim.findings || []).forEach(f => {
      const loc = f.file ? `${f.file}${f.line ? ':'+f.line : ''}` : '';
      html += `<div class="analysis-finding">`;
      if (f.severity) html += `<span class="badge badge-${f.severity}">${esc(f.severity)}</span> `;
      html += `${esc(f.title)}`;
      if (loc) html += ` <span class="item-file">${esc(loc)}</span>`;
      html += `</div>`;
    });
    html += `</div>`;
  });
  html += `</div></div>`;
  document.getElementById('detailed-section').innerHTML = html;
}

function toggleSection(el) { el.classList.toggle('open'); el.nextElementSibling.classList.toggle('open'); }
function toggleFindings(idx) { document.getElementById('findings-'+idx).classList.toggle('open'); }
function toggleCapFindings(idx) { document.getElementById('cap-findings-'+idx).classList.toggle('open'); }

function showThemePrompt(idx) {
  const opp = DATA.opportunities[idx];
  if (!opp) return;
  let prompt = `## Task: ${opp.name}\nAgent path: ${DATA.meta.skill_path}\n\n### Problem\n${opp.description}\n\n### Fix\n${opp.action}\n\n`;
  if (opp.findings && opp.findings.length) {
    prompt += `### Specific observations to address:\n\n`;
    opp.findings.forEach((f, i) => {
      const loc = f.file ? (f.line ? `${f.file}:${f.line}` : f.file) : '';
      prompt += `${i+1}. **${f.title}**`;
      if (loc) prompt += ` (${loc})`;
      if (f.detail) prompt += `\n   ${f.detail}`;
      prompt += `\n`;
    });
  }
  document.getElementById('modal-title').textContent = `Fix: ${opp.name}`;
  document.getElementById('modal-content').textContent = prompt.trim();
  document.getElementById('modal').classList.add('visible');
}

function showBrokenPrompt() {
  const items = DATA.broken || [];
  let prompt = `## Task: Fix Critical Issues\nAgent path: ${DATA.meta.skill_path}\n\n`;
  items.forEach((item, i) => {
    const loc = item.file ? (item.line ? `${item.file}:${item.line}` : item.file) : '';
    prompt += `${i+1}. **[${(item.severity||'high').toUpperCase()}] ${item.title}**\n`;
    if (loc) prompt += `   File: ${loc}\n`;
    if (item.detail) prompt += `   Context: ${item.detail}\n`;
    if (item.action) prompt += `   Fix: ${item.action}\n\n`;
  });
  document.getElementById('modal-title').textContent = 'Fix Critical Issues';
  document.getElementById('modal-content').textContent = prompt.trim();
  document.getElementById('modal').classList.add('visible');
}

function closeModal() { document.getElementById('modal').classList.remove('visible'); }
function copyModal() {
  navigator.clipboard.writeText(document.getElementById('modal-content').textContent).then(() => {
    const btn = document.querySelector('.modal .btn-primary');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy to Clipboard'; }, 1500);
  });
}

init();
</script>
</body>
</html>
